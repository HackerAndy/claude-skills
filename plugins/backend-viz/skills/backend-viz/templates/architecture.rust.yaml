# backend-viz architecture rules (Rust / axum)
# Each file is assigned to the FIRST layer whose glob matches its path (fnmatch: * also matches /).
# may_depend_on = which OTHER layers this layer is allowed to use (`use` lines and inline paths such as
# crate::services::orders::create). Same-layer use is always fine. `mod x;` lines don't count.
# In a workspace, write globs per crate: "crates/*/src/routes/*".
layers:
  - name: routes
    description: HTTP edge. Parse the request, call a service, shape the response. No storage.
    paths: ["src/main.rs", "src/routes/*", "src/handlers/*", "src/api/*"]
    may_depend_on: [services, schemas, core, trace]
  - name: services
    description: Business logic. No axum types.
    paths: ["src/services/*", "src/domain/*"]
    may_depend_on: [repositories, schemas, core, trace]
  - name: repositories
    description: Data access only. The only layer that talks to the database.
    paths: ["src/repositories/*", "src/repos/*", "src/db/*"]
    may_depend_on: [models, core, trace]
  - name: models
    description: Stored rows.
    paths: ["src/models/*"]
    may_depend_on: [core]
  - name: schemas
    description: serde request/response types (mirror the contract).
    paths: ["src/schemas/*", "src/dto/*"]
    may_depend_on: []
  - name: core
    description: Config, errors, the crate root.
    paths: ["src/lib.rs", "src/config.rs", "src/error.rs", "src/core/*"]
    may_depend_on: []

tracing:
  required_in: [services, repositories]   # every public function here must be #[traced]
  decorator: traced

enforce:
  layer_violations: true
  undocumented_endpoints: true

ignore: ["tests/*", "benches/*", "examples/*", "target/*", "**/build.rs"]

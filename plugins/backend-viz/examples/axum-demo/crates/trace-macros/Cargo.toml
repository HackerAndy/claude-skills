# The #[traced] attribute for backend-viz's Rust tracer. Installed by backend-viz: change it in claude-skills, not here.
[package]
name = "trace-macros"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

openapi: 3.1.0
info: { title: Orders API, version: 0.1.0 }
paths:
  /health:
    get: { summary: Liveness check, tags: [system], responses: { "200": { description: OK } } }
  /api/v1/orders:
    get:  { summary: List orders, tags: [orders], responses: { "200": { description: OK } } }
    post: { summary: Create an order, tags: [orders], responses: { "201": { description: Created } } }
  /api/v1/orders/{orderId}:
    get:  { summary: Get one order, tags: [orders], responses: { "200": { description: OK } } }
    delete: { summary: Cancel an order, tags: [orders], responses: { "204": { description: Cancelled } } }
  /api/v1/customers/{customerId}:
    get:  { summary: Get a customer, tags: [customers], responses: { "200": { description: OK } } }

name: code-quality
on: [pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: hashFiles('package-lock.json') != ''
        run: npm ci
      - run: python3 .quality/quality_gate.py check --full --base origin/${{ github.base_ref }}

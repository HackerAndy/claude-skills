<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code quality</title>
<style>
:root{
  --bg:#f6f5f1;--panel:#ffffff;--ink:#1d1d1b;--muted:#6b6a64;--faint:#a8a69e;--line:#e6e4dc;--line2:#cfccc1;--ghost:#f1f0eb;
  --g:#2f7d4f;--g-bg:#e3f1e8;--g-fill:#3f9a64;
  --y:#7d6200;--y-bg:#fbf1c7;--y-fill:#e2b714;
  --r:#b8321f;--r-bg:#fbe5e1;--r-fill:#d9483b;
  --accent:#1f5fa8;--accent-bg:#e7f0fa;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#a3a198;--faint:#5f5d57;--line:#2e2d2a;--line2:#3d3c38;--ghost:#232220;
  --g:#72c993;--g-bg:#1b3325;--g-fill:#4caf74;
  --y:#f0cd55;--y-bg:#3a3212;--y-fill:#d9b22a;
  --r:#f28a7a;--r-bg:#3d1f1b;--r-fill:#e0574a;
  --accent:#7fb2ea;--accent-bg:#1a2b40;}}
:root[data-theme="dark"]{
  --bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--muted:#a3a198;--faint:#5f5d57;--line:#2e2d2a;--line2:#3d3c38;--ghost:#232220;
  --g:#72c993;--g-bg:#1b3325;--g-fill:#4caf74;
  --y:#f0cd55;--y-bg:#3a3212;--y-fill:#d9b22a;
  --r:#f28a7a;--r-bg:#3d1f1b;--r-fill:#e0574a;
  --accent:#7fb2ea;--accent-bg:#1a2b40;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
code,.mono{font:12.5px var(--mono)}
button{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:16px;font-weight:600;margin:0}
header .meta{color:var(--muted);font-size:12px}
header .sp{flex:1}
main{padding:20px 24px 40px;display:grid;gap:16px;max-width:1240px;margin:0 auto}
@media (max-width:700px){main,header{padding-left:16px;padding-right:16px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.ph{font-size:13px;font-weight:600;margin:0;padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph small{font-weight:400;color:var(--muted)}
.ph .sp{flex:1}

/* the verdict */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px 28px;align-items:center;padding:20px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.big{display:grid;gap:2px}
.big .n{font-size:44px;font-weight:650;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big .l{font-size:12.5px;color:var(--muted)}
.verdict{margin:0 0 10px;font-size:15px}
.verdict b{font-weight:600}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--ghost)}
.stack span{display:block;height:100%}
.stack .green{background:var(--g-fill)}.stack .yellow{background:var(--y-fill)}.stack .red{background:var(--r-fill)}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.sq{width:10px;height:10px;border-radius:3px;display:inline-block}
.sq.green{background:var(--g-fill)}.sq.yellow{background:var(--y-fill)}.sq.red{background:var(--r-fill)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{padding:12px 20px;border-right:1px solid var(--line)}
.tile:last-child{border-right:none}
.tile .n{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.gate{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 11px;border-radius:999px;font-weight:500}
.gate.ok{background:var(--g-bg);color:var(--g)}.gate.bad{background:var(--r-bg);color:var(--r)}

/* score chips */
.chip{display:inline-block;min-width:44px;text-align:center;font:600 12px var(--mono);padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.chip.green{background:var(--g-bg);color:var(--g)}.chip.yellow{background:var(--y-bg);color:var(--y)}.chip.red{background:var(--r-bg);color:var(--r)}
.chip.none{background:var(--ghost);color:var(--faint)}
.txt.green{color:var(--g)}.txt.yellow{color:var(--y)}.txt.red{color:var(--r)}

/* fix first */
.tgt{display:grid;grid-template-columns:52px minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:12px;align-items:center;padding:9px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.tgt:last-child{border-bottom:none}
.tgt:hover{background:var(--bg)}
.tgt b{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgt small{display:block;color:var(--muted);font:11.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgt .why{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgt .ch{font-size:11.5px;color:var(--faint);white-space:nowrap}
@media (max-width:760px){.tgt{grid-template-columns:52px minmax(0,1fr)}.tgt .why,.tgt .ch{grid-column:2}}

/* explorer */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{border:0;background:none;padding:3px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--ghost);color:var(--ink);font-weight:600}
input[type=search]{border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:7px;padding:3px 9px;font:12.5px var(--sans);width:200px;max-width:100%}
.hd,.row{display:grid;grid-template-columns:minmax(0,1fr) 150px 92px 56px 64px;gap:12px;align-items:center;padding:7px 16px}
.hd{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg)}
.hd span:not(:first-child){text-align:right}
.row{border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.row:hover{background:var(--bg)}
.row .nm{display:flex;align-items:center;gap:8px;min-width:0}
.row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .num{text-align:right;font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row .num.new{color:var(--r);font-weight:600}
.row .sc{text-align:right}
.chev{width:12px;flex:none;color:var(--faint);transition:transform .12s;display:inline-block}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.row.l1{padding-left:36px}.row.l2{padding-left:58px;cursor:pointer}
.row.l1 .nm{font:12.5px var(--mono)}
.row.l2 .nm{font:12.5px var(--mono)}
.mini{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--ghost)}
.mini span{display:block;height:100%}
.mini .green{background:var(--g-fill)}.mini .yellow{background:var(--y-fill)}.mini .red{background:var(--r-fill)}
@media (max-width:760px){.hd,.row{grid-template-columns:minmax(0,1fr) 70px 56px}.hd .wide,.row .wide{display:none}}
.detail{padding:10px 16px 14px 80px;border-bottom:1px solid var(--line);background:var(--bg);display:grid;gap:10px}
@media (max-width:760px){.detail{padding-left:24px}}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 16px}
@media (max-width:760px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.metric .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.metric .t b{color:var(--ink);font:600 12px var(--mono)}
.bar{position:relative;height:6px;border-radius:3px;background:var(--ghost);margin-top:4px;overflow:hidden}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar span.green{background:var(--g-fill)}.bar span.yellow{background:var(--y-fill)}.bar span.red{background:var(--r-fill)}
.bar i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.45}
.math{margin:0;font-size:13.5px}
.issues{display:grid;gap:8px}
.issue{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--y-fill);border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer}
.issue.lint-issue{border-left-color:var(--r-fill)}
.issue:hover{border-color:var(--line2)}
.issue p{margin:4px 0 0;color:var(--ink)}
.issue p b{font-weight:600}
.issue .where{color:var(--muted)}
.issue p a{color:var(--accent)}
.issue code,.math code{font:12px var(--mono);background:var(--ghost);padding:0 4px;border-radius:4px}
.it{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.it b{font-size:13.5px}
.it .meta{font:11.5px var(--mono);color:var(--muted)}
.it a{margin-left:auto;font-size:12px;color:var(--accent);text-decoration:none}
.it a:hover{text-decoration:underline}
details.ex{margin-top:6px}
details.ex summary{cursor:pointer;font-size:12px;color:var(--accent)}
.exg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:6px}
.exg pre{margin:3px 0 0;padding:8px 10px;background:var(--ghost);border-radius:6px;font:12px/1.45 var(--mono);overflow:auto}
.code{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;font:12px/1.55 var(--mono);padding:6px 0;max-height:260px}
.code.tall{max-height:480px}
.cl{display:grid;grid-template-columns:44px 26px max-content;min-width:100%}
.cl .gn{color:var(--faint);text-align:right;padding-right:8px;user-select:none}
.cl .gm{color:var(--y);font-weight:600;font-size:10.5px;user-select:none}
.cl .tx{white-space:pre;padding-right:16px}
.cl.dim .tx{opacity:.5}
.cl.l-lint{background:var(--r-bg)}
.cl.l-lint .gn{color:var(--r);font-weight:600}
.cl.cmore .tx{color:var(--muted);font-style:italic}
.cl.hit{outline:2px solid var(--accent);outline-offset:-2px}
mark{background:none;color:inherit;border-radius:3px}
mark.k-branch{background:var(--y-bg);box-shadow:inset 0 -2px 0 var(--y-fill);font-weight:700}
mark.k-default{background:var(--y-bg);box-shadow:inset 0 -2px 0 var(--y-fill);font-weight:700}
mark.k-lint,mark.k-new{text-decoration:wavy underline var(--r-fill);text-decoration-thickness:1.5px;text-underline-offset:3px;background:color-mix(in srgb,var(--r-fill) 18%,transparent)}
.key{font:600 10.5px var(--mono);padding:0 6px;border-radius:4px;margin-left:6px;text-transform:none;letter-spacing:0}
.key.k-branch{background:var(--y-bg);color:var(--y)}.key.k-lint{background:var(--r-bg);color:var(--r)}
.pair{display:grid;gap:6px}
.finds{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:12.5px}
.finds li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px}
.finds .ln{font:12px var(--mono);color:var(--faint);text-align:right}
.finds .rule{font:11.5px var(--mono);color:var(--muted);margin-right:6px}
.tag{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:0 6px;border-radius:4px;background:var(--r-bg);color:var(--r);margin-right:6px}
.sub{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.more{border:0;background:none;color:var(--accent);font-size:12.5px;cursor:pointer;padding:8px 16px 8px 58px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.more:hover{text-decoration:underline}
.quiet{padding:10px 16px;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}
.empty{padding:28px 16px;color:var(--muted);text-align:center;font-size:13px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--accent-bg)}}
details.how{font-size:13px;color:var(--muted)}
details.how summary{cursor:pointer;color:var(--ink);font-weight:600;font-size:13px;padding:11px 16px}
details.how div{padding:0 16px 14px}
details.how code{background:var(--ghost);padding:1px 5px;border-radius:4px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
</style>
</head>
<body>
<header>
  <h1 id="title">Code quality</h1>
  <span class="meta" id="meta"></span>
  <span class="sp"></span>
  <span id="gate"></span>
</header>
<main id="main"></main>
<script>
const R = /*__REPORT__*/null
const $ = (s, el = document) => el.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const fmt = n => (n ?? 0).toLocaleString()
const T = R ? R.thresholds : { green: 90, yellow: 70 }
const band = s => (s == null ? 'none' : s >= T.green ? 'green' : s >= T.yellow ? 'yellow' : 'red')
const chip = s => `<span class="chip ${band(s)}">${s == null ? '–' : s + '%'}</span>`
const pct = (a, b) => (b ? Math.round((100 * a) / b) : null)
const METRIC = { ccn: 'Branches (cyclomatic)', cognitive: 'Cognitive complexity', nloc: 'Lines of code', params: 'Parameters' }
const LABEL = { green: `${T.green}% and up`, yellow: `${T.yellow}–${T.green - 1}%`, red: `below ${T.yellow}%` }

const state = { show: 'work', query: '', open: new Set(), all: new Set() }

function stack(b, cls = 'stack') {
  const total = b.green + b.yellow + b.red
  if (!total) return `<div class="${cls}"></div>`
  return `<div class="${cls}" role="img" aria-label="${b.green} green, ${b.yellow} yellow, ${b.red} red">` +
    ['green', 'yellow', 'red'].filter(k => b[k]).map(k => `<span class="${k}" style="width:${(100 * b[k]) / total}%"></span>`).join('') + '</div>'
}

function hero() {
  const s = R.summary
  const share = pct(s.approved, s.functions)
  const words = []
  if (s.bands.red) words.push(`<b class="txt red">${fmt(s.bands.red)}</b> need real work`)
  if (s.bands.yellow) words.push(`<b class="txt yellow">${fmt(s.bands.yellow)}</b> are close`)
  const verdict = s.functions
    ? `<b>${fmt(s.approved)} of ${fmt(s.functions)}</b> functions are approved (${T.green}% or more).` +
      (words.length ? ' ' + words.join(' and ') + '.' : ' Every function is inside the limits.')
    : 'No functions found in scope.'
  return `<section class="panel">
    <div class="hero">
      <div class="big"><span class="n txt ${band(share)}">${share ?? '–'}%</span><span class="l">functions approved</span></div>
      <div>
        <p class="verdict">${verdict}</p>
        ${stack(s.bands)}
        <div class="legend">${['green', 'yellow', 'red'].map(k => `<span><i class="sq ${k}"></i><b>${fmt(s.bands[k])}</b> ${LABEL[k]}</span>`).join('')}</div>
      </div>
    </div>
    <div class="tiles">
      <div class="tile"><div class="n txt ${band(s.average)}">${s.average ?? '–'}%</div><div class="l">average score (for reading only)</div></div>
      <div class="tile"><div class="n">${fmt(s.files)}</div><div class="l">files, in ${fmt(R.folders.length)} folders</div></div>
      <div class="tile"><div class="n">${fmt(s.findings)}</div><div class="l">findings, all kinds</div></div>
      <div class="tile"><div class="n ${s.new ? 'txt red' : ''}">${fmt(s.new)}</div><div class="l">new since the baseline</div></div>
    </div>
  </section>`
}

function targets() {
  if (!R.targets.length) return ''
  const rows = R.targets.map((t, i) => `<button class="tgt" data-goto="${esc(t.file)}" data-fn="${esc(t.symbol)}">
      ${chip(t.score)}
      <span><b>${esc(t.symbol)}</b><small>${esc(t.file)}:${t.line}</small></span>
      <span class="why">${esc(t.why.join(' · ') || 'lint findings')}</span>
      <span class="ch">${t.churn ? `changed ${t.churn}× lately` : ''}</span>
    </button>`).join('')
  return `<section class="panel">
    <h2 class="ph">Fix first <small>lowest scores in the most-changed files: (100 − score) × (1 + commits in 180 days)</small></h2>
    ${rows}
  </section>`
}

const matches = (name, fn) => {
  const q = state.query.trim().toLowerCase()
  return !q || name.toLowerCase().includes(q) || (fn && fn.symbol.toLowerCase().includes(q))
}
const needsWork = fn => state.show === 'all' || (state.show === 'work' ? fn.score < T.green : fn.score < T.yellow)

function fileTally(e) {
  const b = { green: 0, yellow: 0, red: 0 }
  for (const fn of e.functions) b[band(fn.score)]++
  const worst = e.functions.length ? Math.min(...e.functions.map(f => f.score)) : null
  return { b, worst, approved: b.green, n: e.functions.length, findings: e.findings.length, fresh: e.findings.filter(f => f.new).length }
}

function visibleFile(name, e) {
  if (state.query) return matches(name) || e.functions.some(fn => matches(name, fn))  // a search looks everywhere
  const t = fileTally(e)
  const flagged = state.show === 'all' || t.fresh || e.functions.some(needsWork) ||
    (state.show === 'work' && e.findings.some(f => f.symbol === '<file>'))
  return flagged && (matches(name) || e.functions.some(fn => matches(name, fn)))
}

function row(level, key, name, t, extra = '') {
  const open = state.open.has(key)
  return `<button class="row l${level}" data-key="${esc(key)}" aria-expanded="${open}" ${extra}>
    <span class="nm"><i class="chev">▸</i><span>${esc(name)}</span></span>
    <span class="wide">${stack(t.b, 'mini')}</span>
    <span class="num wide">${fmt(t.approved)}/${fmt(t.n)}</span>
    <span class="num ${t.fresh ? 'new' : ''}" title="${t.fresh ? t.fresh + ' new' : ''}">${fmt(t.findings)}</span>
    <span class="sc">${chip(t.worst)}</span>
  </button>`
}

function metricBars(fn) {
  return '<div class="metrics">' + Object.entries(fn.values).map(([m, v]) => {
    const limit = R.limits[m]
    const r = v / limit
    const score = r <= 1 ? 100 - 10 * r : 90 - 30 * (r - 1)
    const scale = Math.max(limit * 2, v)
    return `<div class="metric"><div class="t"><span>${METRIC[m] ?? m}</span><b class="txt ${band(score)}">${v} / ${limit}</b></div>
      <div class="bar"><span class="${band(score)}" style="width:${(100 * v) / scale}%"></span><i style="left:${(100 * limit) / scale}%" title="limit"></i></div></div>`
  }).join('') + '</div>'
}

const LINT_COST = 5
const metricScore = (v, limit) => { const r = v / limit; return r <= 1 ? 100 - 10 * r : 90 - 30 * (r - 1) }
const inRange = (f, fn) => f.line >= fn.line && f.line <= fn.end
// The function a lint finding counts against: the smallest one around it, as the gate scores it.
const owner = (f, e) => e.functions.filter(fn => inRange(f, fn)).sort((a, b) => (a.end - a.line) - (b.end - b.line))[0]

function scoreMath(fn) {
  const parts = Object.entries(fn.values).map(([m, v]) => ({ m, v, s: metricScore(v, R.limits[m]) }))
  const worst = parts.reduce((a, b) => (b.s < a.s ? b : a))
  const base = `the worst measure, ${(R.metrics[worst.m]?.title ?? worst.m).toLowerCase()} (${worst.v} against a limit of ${R.limits[worst.m]}), gives <b>${Math.round(worst.s)}%</b>`
  const lint = fn.smells ? `, minus ${LINT_COST} for each of its ${fn.smells} lint finding${fn.smells > 1 ? 's' : ''}` : ''
  return `<p class="math">Score <b class="txt ${band(fn.score)}">${fn.score}%</b>: ${base}${lint}.${fn.score >= T.green ? '' : ` Approved needs ${T.green}%.`}</p>`
}

function helpFor(f) {
  const tool = f.rule.includes(':') ? f.rule.split(':')[0] : null
  if (R.rules[f.rule]) return R.rules[f.rule]
  if (R.metrics[f.rule]) return R.metrics[f.rule]
  if (['tsc', 'mypy', 'pyright'].includes(tool)) return { title: 'Type error', what: `${tool} says the types here don't fit together.`, why: 'Code that type-checks can still be wrong, but code that doesn\'t usually is.', fix: 'Fix the types or the code so they agree; don\'t silence it with a cast or an ignore comment.' }
  return { title: f.rule }
}

function issueCard(f, opts = {}) {
  const h = helpFor(f)
  const metric = !!R.metrics[f.rule] && f.rule !== 'duplicate'
  const title = metric ? h.title : esc(f.message.replace(/\.$/, ''))
  const meta = metric ? `${f.message.match(/\d+/)?.[0] ?? ''} against a limit of ${R.limits[f.rule]}`
    : `${esc(f.rule.split(':').pop())} · ${(f.end_line ?? f.line) - f.line >= WIDE ? `lines ${f.line}–${f.end_line}` : `line ${f.line}`}${opts.inFn ? ` · −${LINT_COST} points` : ''}`
  const what = h.what && h.what.replace(/\.$/, '') !== f.message.replace(/\.$/, '') ? `<p><b>What it means.</b> ${md(h.what)}</p>` : ''
  const ex = h.bad || h.good ? `<details class="ex"><summary>Example</summary><div class="exg">
      ${h.bad ? `<div><div class="sub">Flagged</div><pre>${esc(h.bad)}</pre></div>` : ''}${h.good ? `<div><div class="sub">Instead</div><pre>${esc(h.good)}</pre></div>` : ''}</div></details>` : ''
  return `<div class="issue ${metric ? 'metric-issue' : 'lint-issue'} ${f.new ? 'is-new' : ''}" data-lines="${f.line}-${f.end_line ?? f.line}" tabindex="0">
    <div class="it">${f.new ? '<span class="tag">new</span>' : ''}<b>${title}</b><span class="meta">${meta}</span>${h.url ? `<a href="${esc(h.url)}" target="_blank" rel="noopener">rule docs ↗</a>` : ''}</div>
    ${what}${h.why ? `<p><b>Why it matters.</b> ${md(h.why)}</p>` : ''}${h.fix ? `<p><b>How to fix.</b> ${md(h.fix)}</p>` : ''}
    ${opts.where ? `<p class="where">${opts.where}</p>` : ''}${ex}
  </div>`
}

// Inline `code` in rule docs.
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')

// Code with marks: [{line, col, endLine, endCol, kind}], columns 1-based, end exclusive; no col marks the whole line.
function codeBlock(code, marks, opts = {}) {
  const byLine = new Map()
  const add = (n, m) => byLine.set(n, [...(byLine.get(n) ?? []), m])
  for (const m of marks) {
    const last = m.endLine ?? m.line
    for (let n = m.line; n <= last; n++) {
      add(n, { a: n === m.line ? m.col ?? null : 1, b: n === last ? m.endCol ?? null : null, kind: m.kind, whole: !m.col })
    }
  }
  const rows = code.lines.map((text, i) => {
    const n = code.start + i
    const ms = byLine.get(n) ?? []
    const dim = opts.dim?.has(n) ? ' dim' : ''
    const cls = [...new Set(ms.map(m => (m.kind === 'lint' || m.kind === 'new' ? 'l-lint' : m.whole ? 'l-' + m.kind : '')).filter(Boolean))]
    const gut = ms.filter(m => m.kind === 'branch' || m.kind === 'default').length
    return `<div class="cl ${cls.join(' ')}${dim}" data-n="${n}"><span class="gn">${n}</span><span class="gm">${gut ? '+' + gut : ''}</span><span class="tx">${paint(text, ms.filter(m => !m.whole))}</span></div>`
  }).join('')
  const more = code.more ? `<div class="cl cmore"><span class="gn"></span><span class="gm"></span><span class="tx">… ${code.more} more line${code.more > 1 ? 's' : ''}</span></div>` : ''
  return `<div class="code${opts.tall ? ' tall' : ''}">${rows}${more}</div>`
}

function paint(text, ms) {
  if (!ms.length) return esc(text) || ' '
  const cuts = new Set([0, text.length])
  for (const m of ms) { cuts.add(Math.max(0, (m.a ?? 1) - 1)); cuts.add(m.b == null ? text.length : Math.min(text.length, m.b - 1)) }
  const pts = [...cuts].sort((a, b) => a - b)
  let out = ''
  for (let i = 0; i < pts.length - 1; i++) {
    const [x, y] = [pts[i], pts[i + 1]]
    if (x === y) continue
    const kinds = ms.filter(m => (m.a ?? 1) - 1 <= x && (m.b == null ? text.length : m.b - 1) >= y).map(m => 'k-' + m.kind)
    const seg = esc(text.slice(x, y))
    out += kinds.length ? `<mark class="${[...new Set(kinds)].join(' ')}">${seg}</mark>` : seg
  }
  return out
}

// A finding spanning more than a few lines (a whole function) marks only its first line, not all of it.
const WIDE = 3
const lintMark = f => ((f.end_line ?? f.line) - f.line >= WIDE
  ? { line: f.line, kind: f.new ? 'new' : 'lint' }
  : { line: f.line, col: f.col, endLine: f.end_line, endCol: f.end_col, kind: f.new ? 'new' : 'lint' })

function fnDetail(fn, e) {
  const own = e.findings.filter(f => f.symbol === fn.symbol)
  const lint = e.findings.filter(f => !f.symbol && inRange(f, fn))
  const counted = lint.filter(f => owner(f, e) === fn && ['ruff', 'biome'].includes(f.rule.split(':')[0]))
  const branchy = own.some(f => f.rule === 'ccn' || f.rule === 'cognitive')
  const c = fn.code
  const nb = c ? c.branches.length : 0
  const nested = new Set((c?.nested ?? []).flatMap(([a, b]) => Array.from({ length: b - a }, (_, k) => c.start + a + 1 + k)))
  const where = c && branchy && nb
    ? `Highlighted in yellow: the ${nb} place${nb > 1 ? 's' : ''} that add a path, each <b>+1</b> in the margin (${c.branches.filter(b => b[3] === 'default').length ? 'a default value counts too; ' : ''}the function itself is the first path).${nested.size ? ' Dimmed lines are functions nested inside it, scored on their own.' : ''}${own.some(f => f.rule === 'cognitive') ? ' Cognitive complexity also charges more for each one nested deeper.' : ''}`
    : ''
  const cards = [
    ...own.map(f => issueCard(f, { where: f.rule === 'ccn' || f.rule === 'cognitive' ? where : f.rule === 'nloc' ? `${fn.values.nloc} lines of code, from line ${fn.line} to ${fn.end}.` : '' })),
    ...lint.map(f => issueCard(f, { inFn: counted.includes(f) })),
  ].join('')
  const marks = c ? [
    ...(branchy ? c.branches.map(([i, a, b, k]) => ({ line: c.start + i, col: a, endLine: c.start + i, endCol: b, kind: k })) : []),
    ...lint.map(lintMark),
  ] : []
  return `<div class="detail">
    ${scoreMath(fn)}
    ${metricBars(fn)}
    ${cards ? `<div class="issues">${cards}</div>` : ''}
    ${c ? `<div class="sub">The code${branchy ? ' <span class="key k-branch">path</span>' : ''}${lint.length ? ' <span class="key k-lint">lint</span>' : ''}</div>${codeBlock(c, marks, { tall: true, dim: nested })}` : ''}
    ${!c && lint.length ? lint.map(f => f.context ? codeBlock(f.context, [lintMark(f)]) : '').join('') : ''}
  </div>`
}

function looseDetail(list) {
  return list.map(f => `<div class="pair">${issueCard(f)}${f.context ? codeBlock(f.context, [lintMark(f)]) : ''}</div>`).join('')
}

function fileBody(name, e) {
  const fns = [...e.functions].sort((a, b) => a.score - b.score || a.line - b.line)
  const shown = state.all.has(name) ? fns : fns.filter(needsWork)
  let out = ''
  for (const fn of shown) {
    const key = `${name}::${fn.symbol}`
    const t = { b: { green: 0, yellow: 0, red: 0, [band(fn.score)]: 1 }, worst: fn.score, approved: +(fn.score >= T.green), n: 1,
      findings: e.findings.filter(f => f.symbol === fn.symbol || (f.line >= fn.line && f.line <= fn.end)).length,
      fresh: e.findings.filter(f => f.new && (f.symbol === fn.symbol || (f.line >= fn.line && f.line <= fn.end))).length }
    out += row(2, key, `${fn.symbol}  :${fn.line}`, t)
    if (state.open.has(key)) out += fnDetail(fn, e)
  }
  const hidden = fns.length - shown.length
  if (hidden) out += `<button class="more" data-all="${esc(name)}">Show ${hidden} approved function${hidden > 1 ? 's' : ''}</button>`
  if (!fns.length) out += `<div class="quiet" style="padding-left:58px">No functions in this file.</div>`
  const loose = e.findings.filter(f => f.symbol === '<file>' || (!f.symbol && !e.functions.some(fn => f.line >= fn.line && f.line <= fn.end)))
  if (loose.length) out += `<div class="detail" style="padding-left:58px"><div class="sub">Other findings in the file</div>${looseDetail(loose)}</div>`
  return out
}

function folderBody(folder) {
  const names = Object.keys(R.files).filter(n => (n.includes('/') ? n.slice(0, n.lastIndexOf('/')) : '.') === folder.path)
  const rows = names.filter(n => visibleFile(n, R.files[n])).map(n => [n, fileTally(R.files[n])])
    .sort((a, b) => (a[1].worst ?? 101) - (b[1].worst ?? 101) || a[0].localeCompare(b[0]))
  let out = ''
  for (const [n, t] of rows) {
    out += row(1, n, n.slice(n.lastIndexOf('/') + 1), t)
    if (state.open.has(n)) out += fileBody(n, R.files[n])
  }
  return out
}

function explorer() {
  const folders = R.folders.filter(f => Object.keys(R.files).some(n => (n.includes('/') ? n.slice(0, n.lastIndexOf('/')) : '.') === f.path && visibleFile(n, R.files[n])))
  const hidden = R.folders.length - folders.length
  let body = ''
  for (const f of folders) {
    const key = 'dir:' + f.path
    body += row(0, key, f.path + '/', { b: f.bands, worst: f.worst, approved: f.approved, n: f.functions, findings: f.findings, fresh: f.new })
    if (state.open.has(key) || state.query) body += folderBody(f)
  }
  if (!folders.length) body = `<div class="empty">${state.query ? 'Nothing matches.' : 'Nothing to show here: every function passes this filter.'}</div>`
  else if (hidden && state.show !== 'all' && !state.query) body += `<div class="quiet">${hidden} more folder${hidden > 1 ? 's are' : ' is'} all ${state.show === 'red' ? 'above ' + T.yellow + '%' : 'green'}. Choose “All” to see them.</div>`
  return `<div class="hd"><span>Folder · file · function</span><span class="wide">green / yellow / red</span><span class="wide">approved</span><span>findings</span><span>lowest</span></div>${body}`
}

function explorerPanel() {
  const seg = [['work', `Below ${T.green}%`], ['red', `Below ${T.yellow}%`], ['all', 'All']]
    .map(([k, l]) => `<button data-show="${k}" aria-pressed="${state.show === k}">${l}</button>`).join('')
  return `<section class="panel" id="explore">
    <h2 class="ph">Drill down <small>folders, worst first · click a row to open it</small><span class="sp"></span>
      <span class="tools"><span class="seg" role="group" aria-label="Show">${seg}</span><input type="search" id="q" placeholder="Find a file or function" aria-label="Find a file or function" value="${esc(state.query)}"></span>
    </h2>
    <div id="tree">${explorer()}</div>
  </section>`
}

function how() {
  const l = R.limits
  return `<section class="panel"><details class="how"><summary>How scores work</summary><div>
    Each function gets the score of its worst metric: 100 at zero, 90 exactly at the limit, then 30 points lower for every 100% over it,
    minus 5 for each lint finding inside it. A function is approved at ${T.green}% or more.
    Limits: branches <code>${l.ccn}</code>, cognitive complexity <code>${l.cognitive}</code>, lines <code>${l.nloc}</code>,
    parameters <code>${l.params}</code>, file length <code>${l.file_nloc}</code> lines.
    Colors: <span class="txt green">green</span> ${LABEL.green}, <span class="txt yellow">yellow</span> ${LABEL.yellow}, <span class="txt red">red</span> ${LABEL.red}.
    ${R.full ? '' : 'Type checking and duplication aren’t included: run <code>report --full</code> for them.'}
  </div></details></section>`
}

function renderTree() { $('#tree').innerHTML = explorer() }

function render() {
  if (!R) { $('#main').innerHTML = '<div class="panel empty">No report data. Run <code>quality_gate.py report</code>.</div>'; return }
  document.title = `Code quality · ${R.project}`
  $('#title').textContent = `Code quality · ${R.project}`
  $('#meta').textContent = `updated ${R.generated.replace('T', ' ')}`
  $('#gate').innerHTML = R.summary.new
    ? `<span class="gate bad">● ${fmt(R.summary.new)} new finding${R.summary.new > 1 ? 's' : ''}</span>`
    : '<span class="gate ok">● Gate clean</span>'
  $('#main').innerHTML = hero() + targets() + explorerPanel() + how()
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('button')
  if (!t) return
  if (t.dataset.show) {
    state.show = t.dataset.show
    document.querySelectorAll('[data-show]').forEach(b => b.setAttribute('aria-pressed', b === t))
    return renderTree()
  }
  if (t.dataset.all) { state.all.add(t.dataset.all); return renderTree() }
  if (t.dataset.goto) return goTo(t.dataset.goto, t.dataset.fn)
  if (t.dataset.key) {
    const k = t.dataset.key
    state.open.has(k) ? state.open.delete(k) : state.open.add(k)
    renderTree()
    document.querySelector(`[data-key="${CSS.escape(k)}"]`)?.focus()
  }
})
document.addEventListener('click', ev => {
  const card = ev.target.closest('.issue')
  if (!card || ev.target.closest('a,summary')) return
  const [a, b] = card.dataset.lines.split('-').map(Number)
  const box = card.closest('.detail, .pair')
  const lines = [...box.querySelectorAll('.cl')].filter(l => +l.dataset.n >= a && +l.dataset.n <= b)
  box.querySelectorAll('.cl.hit').forEach(l => l.classList.remove('hit'))
  lines.forEach(l => l.classList.add('hit'))
  lines[0]?.scrollIntoView({ block: 'center', behavior: 'smooth' })
})
document.addEventListener('input', ev => { if (ev.target.id === 'q') { state.query = ev.target.value; renderTree() } })

function goTo(file, fn) {
  const dir = file.includes('/') ? file.slice(0, file.lastIndexOf('/')) : '.'
  state.query = ''
  $('#q').value = ''
  if (state.show === 'red' && R.files[file].functions.every(f => f.score >= T.yellow)) state.show = 'work'
  document.querySelectorAll('[data-show]').forEach(b => b.setAttribute('aria-pressed', b.dataset.show === state.show))
  for (const k of ['dir:' + dir, file, `${file}::${fn}`]) state.open.add(k)
  renderTree()
  const el = document.querySelector(`[data-key="${CSS.escape(`${file}::${fn}`)}"]`)
  if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.add('flash'); el.focus({ preventScroll: true }) }
}

render()
</script>
</body>
</html>

# code-quality: this file opts the project in. Commit it with baseline.json.
# Per-function limits are measured by lizard for Python, JS and TS. Lint uses the
# project's own ruff / biome config, plus the rules added below.

[limits]
# Each is the most allowed: one less than CodeScene's default threshold, since CodeScene warns at it.
ccn = 8           # cyclomatic complexity: independent paths through a function (CodeScene's Complex Method)
cognitive = 15    # cognitive complexity: how hard the function is to read (nesting costs more); not in CodeScene
nloc = 69         # lines of code per function, blank lines and comments excluded (Large Method)
params = 4        # parameters per function (Excess Number of Function Arguments)
nesting = 3       # deepest if / loop / try inside another one (Deep, Nested Complexity)
conditional = 1   # most && / || operators in one condition (Complex Conditional)
bumps = 1         # chunks of nested logic in one function (Bumpy Road)
file_nloc = 599   # lines of code per Python file (Lines of Code in a Single File)
file_nloc_js = 999  # lines of code per JS / TS file

[scope]
# Globs relative to the project root; node_modules, .venv, dist, build etc. are always skipped.
exclude = ["**/migrations/**", "**/*.min.js", "**/vendor/**", "**/*.generated.*"]

[lint]
ruff_extend_select = ["B", "SIM", "C4", "UP"]  # bugbear, simplify, comprehensions, pyupgrade
biome = true

[edit]              # what runs on every check, not just `check --full`
duplication = true  # jscpd scans the project for copies of the code in the files checked; set false if slow

[full]              # `check --full` (CI): slower, project-wide checks
types = true        # pyright for Python, the project's tsc for TypeScript (needs tsconfig.json)
duplication = true  # jscpd across Python, JS and TS
min_tokens = 70     # smallest duplicated block reported

[tools]
download = true     # run a tool through uvx / npx at the pinned version when it isn't installed
# pins = { ruff = "0.17.4" }  # override a pinned version
